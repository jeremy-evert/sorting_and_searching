name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test]"
      - name: Tests
        run: pytest
      - name: Fresh results match the committed CSVs
        run: python scripts/regenerate.py --check
      - name: Numbers quoted in the docs match the data
        run: python scripts/check_big_o.py
      - name: Home page structure and links
        run: python scripts/check_site.py
