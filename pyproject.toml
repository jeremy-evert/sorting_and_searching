[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sorting-and-searching"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib"]
test = ["matplotlib", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]
